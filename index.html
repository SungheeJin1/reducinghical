<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>데뷔 프로젝트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: one-screen palace — entrance (door + puppy + garden) → inside hall (today's form) → gallery (the paper chart). */
:root{
  --rose:#ff7fb0;        /* door, puppy */
  --rose-deep:#e04a86;
  --ruby:#c8183f;        /* palace red */
  --ruby-dark:#7c0a26;
  --blush:#ffe3ee;       /* paper / surfaces */
  --cream:#fff6f9;
  --gold:#e8b53a;
  --gold-light:#ffe39a;
  --gold-dark:#a8741a;
  --ink:#4a1028;
  --ink-soft:#8a4060;
  --leaf:#57b65a;
  --leaf-dark:#2f8a3e;
  --font-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --font-body:"Gowun Dodum",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-hand:"Gaegu","Gowun Dodum",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--ruby-dark);color:var(--ink);font-family:var(--font-body);font-size:16px;
  overflow:hidden;
}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 24px);
  transition:opacity .6s ease}
.screen.off{opacity:0;pointer-events:none}

/* ---------- palace wall background ---------- */
.palace{
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255,227,154,.35), transparent 55%),
    repeating-linear-gradient(90deg, transparent 0 78px, rgba(232,181,58,.18) 78px 80px),
    linear-gradient(180deg,#d42553 0%, var(--ruby) 45%, #9d0f33 100%);
}
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparkles i{position:absolute;width:10px;height:10px;background:var(--gold-light);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
  animation:twinkle 2.4s ease-in-out infinite;opacity:.9}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.2);opacity:1}}

/* gold scalloped valance */
.valance{position:absolute;top:0;left:0;right:0;height:46px;pointer-events:none;
  background:
    radial-gradient(circle at 30px -6px, transparent 22px, var(--gold) 23px, var(--gold-dark) 27px, transparent 28px) 0 0/60px 46px repeat-x,
    linear-gradient(var(--gold-dark),var(--gold)) 0 0/100% 8px no-repeat;
}

/* ---------- entrance ---------- */
#entrance{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:0}
.sign{position:relative;z-index:2;margin-top:52px;text-align:center}
.sign h1{font-family:var(--font-display);font-weight:400;margin:0;font-size:clamp(2.2rem,8vw,3.4rem);
  color:var(--gold-light);letter-spacing:.04em;
  text-shadow:0 2px 0 var(--gold-dark),0 4px 0 var(--ruby-dark),0 0 18px rgba(255,227,154,.7)}
.sign p{margin:.2rem 0 0;color:var(--blush);font-size:.95rem;letter-spacing:.08em}

.stage{position:relative;width:min(520px,100%);flex:1 0 auto;min-height:440px;display:flex;align-items:flex-end;justify-content:center}
/* gold arch frame around the door */
.arch{position:relative;width:220px;height:330px;margin-bottom:62px;
  border-radius:110px 110px 6px 6px;padding:14px 14px 0;
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 40%,var(--gold-dark) 70%,var(--gold));
  box-shadow:0 0 0 4px var(--gold-dark),0 0 40px rgba(255,227,154,.55);perspective:900px}
.arch::before{content:"♛";position:absolute;top:-38px;left:50%;transform:translateX(-50%);
  font-size:42px;color:var(--gold-light);text-shadow:0 2px 0 var(--gold-dark)}
.doorway{position:relative;width:100%;height:100%;border-radius:96px 96px 0 0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 80%,#fff6d6,#ffd1e2 60%,#ff9cc4)}
.doorway .glow{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);color:var(--rose-deep);font-size:1.1rem}
.door{position:absolute;inset:0;border:0;padding:0;border-radius:96px 96px 0 0;
  transform-origin:left center;transition:transform 1.1s cubic-bezier(.6,.05,.3,1);
  background:
    repeating-linear-gradient(90deg, rgba(124,10,38,.0) 0 30px, rgba(124,10,38,.22) 30px 32px),
    repeating-linear-gradient(8deg, transparent 0 9px, rgba(255,255,255,.08) 9px 10px, transparent 10px 23px),
    linear-gradient(90deg,#f56aa3,var(--rose) 50%,#f8609c);
  box-shadow:inset 0 0 0 6px rgba(224,74,134,.6),inset -10px 0 20px rgba(124,10,38,.25)}
.door::before{content:"";position:absolute;left:22px;right:22px;top:58px;height:90px;border-radius:60px 60px 6px 6px;
  border:3px solid rgba(255,227,154,.85);box-shadow:inset 0 0 0 3px rgba(224,74,134,.5)}
.door::after{content:"";position:absolute;left:22px;right:22px;bottom:30px;height:100px;border-radius:6px;
  border:3px solid rgba(255,227,154,.85);box-shadow:inset 0 0 0 3px rgba(224,74,134,.5)}
.knob{position:absolute;right:20px;top:54%;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7cf,var(--gold) 50%,var(--gold-dark));box-shadow:0 2px 3px rgba(0,0,0,.3)}
.door .heart{position:absolute;left:50%;top:94px;transform:translateX(-50%);color:var(--gold-light);font-size:26px;text-shadow:0 1px 0 var(--gold-dark)}
.door:hover{transform:rotateY(-8deg)}
body.opening .door{transform:rotateY(-105deg)}
.hint{margin-top:14px;white-space:nowrap;
  font-family:var(--font-display);color:var(--gold-light);font-size:1rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* puppy + bubble */
.puppy{position:absolute;right:max(0px,calc(50% - 250px));bottom:34px;width:150px;z-index:3;
  transition:transform .4s}
.puppy svg{width:100%;height:auto;display:block}
.puppy .tail{transform-origin:120px 136px;animation:wag .35s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.puppy .ear-l{transform-origin:56px 32px;animation:earL 2.2s ease-in-out infinite}
@keyframes earL{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-10deg)}}
.bubble{position:absolute;right:max(10px,calc(50% - 250px));bottom:196px;z-index:3;
  background:var(--cream);color:var(--rose-deep);font-family:var(--font-display);font-size:1.35rem;
  padding:.55rem 1rem;border-radius:20px;border:3px solid var(--gold);box-shadow:0 4px 0 var(--gold-dark);
  animation:pop .6s .4s both cubic-bezier(.3,1.6,.6,1)}
.bubble::after{content:"";position:absolute;right:46px;bottom:-14px;width:18px;height:18px;background:var(--cream);
  border-right:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(45deg)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (max-width:520px){
  .puppy{width:118px;right:0;bottom:30px}
  .bubble{right:4px;bottom:150px;font-size:1.1rem}
  .arch{width:190px;height:290px;margin-right:90px}
}

/* garden */
.garden{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:2;pointer-events:none}
.garden canvas{width:100%;height:100%;display:block}

/* ---------- inside: hall ---------- */
.hall-inner{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-top:40px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.topbar h2{font-family:var(--font-display);font-weight:400;color:var(--gold-light);margin:0;font-size:1.6rem;
  text-shadow:0 2px 0 var(--ruby-dark)}
.btn{border:2px solid var(--gold-dark);background:linear-gradient(var(--gold-light),var(--gold));color:var(--ruby-dark);
  font-family:var(--font-display);font-size:1rem;padding:.45rem .9rem;border-radius:999px;box-shadow:0 3px 0 var(--gold-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-dark)}
.btn.ghost{background:transparent;color:var(--gold-light);border-color:var(--gold-light);box-shadow:none}
.scroll-card{position:relative;background:var(--cream);border-radius:18px;padding:18px 16px 20px;
  border:3px solid var(--gold);box-shadow:0 0 0 5px var(--rose-deep),0 0 0 8px var(--gold),0 14px 30px rgba(60,0,20,.45)}
.scroll-card::before,.scroll-card::after{content:"✦";position:absolute;top:-16px;color:var(--gold-light);font-size:22px;text-shadow:0 1px 0 var(--gold-dark)}
.scroll-card::before{left:14px}.scroll-card::after{right:14px}
.date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.date-row label{font-family:var(--font-display);color:var(--rose-deep);font-size:1.1rem}
.date-row input{font:inherit;border:2px solid var(--rose);border-radius:10px;padding:.35rem .5rem;background:#fff;color:var(--ink)}
.score{margin-left:auto;font-family:var(--font-display);color:var(--ruby);font-size:1rem;font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:5.6rem 1fr auto;align-items:center;gap:8px}
.item .name{font-family:var(--font-display);color:var(--ink);font-size:1.05rem}
.item input{min-width:0;width:100%;font-family:var(--font-hand);font-size:1.2rem;border:0;border-bottom:2px dashed var(--rose);
  background:transparent;padding:.2rem .2rem;color:var(--ink)}
.item input::placeholder{color:#c99ab0}
.item input:disabled{color:var(--rose-deep)}
.skip{border:2px solid var(--rose);background:#fff;color:var(--rose-deep);border-radius:999px;padding:.25rem .65rem;
  font-family:var(--font-display);font-size:.9rem;white-space:nowrap}
.skip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff}
.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px;flex-wrap:wrap}
.toast{font-family:var(--font-display);color:var(--leaf-dark);min-height:1.2em}
.note{color:var(--blush);font-size:.85rem;text-align:center;margin:0}

/* ---------- gallery: the paper chart ---------- */
.paper{background:#fdfdfb;border-radius:4px;padding:16px 12px;box-shadow:0 0 0 6px var(--gold),0 0 0 10px var(--gold-dark),0 16px 30px rgba(60,0,20,.5)}
.paper-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.paper-head .month{font-family:var(--font-hand);font-size:1.7rem;font-weight:700;color:#222}
.paper-head h3{margin:0;font-size:1.25rem;color:#111;font-weight:700;letter-spacing:.02em}
.pager{display:flex;gap:6px;align-items:center}
.pager button{border:1px solid #999;background:#fff;border-radius:6px;padding:.15rem .55rem;color:#333}
.pager span{font-size:.85rem;color:#555;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:900px;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px dashed #555;padding:4px 3px;text-align:center;font-size:.8rem;vertical-align:middle}
thead th{font-weight:700;color:#333;border-top:1.5px solid #222;border-bottom:1.5px solid #222}
tbody th{width:5.5rem;font-weight:700;color:#222;white-space:nowrap}
tbody tr:nth-child(odd){background:repeating-linear-gradient(90deg,#d9d9d9 0 3px,#cfcfcf 3px 4px)}
tbody tr:nth-child(odd) th{color:#666}
td{font-family:var(--font-hand);font-size:1rem;color:#1a1a1a;line-height:1.1;min-width:52px;height:36px;word-break:keep-all}
td.x{font-size:1.35rem}
td.today{box-shadow:inset 0 0 0 2px var(--rose-deep)}
td.weekend-end{background:#bdbdbd}
.legend{margin:10px 0 0;font-size:.8rem;color:#555}
</style>
</head>

<!-- ============ HALL (input) ============ -->
<section id="hall" class="screen palace off" aria-label="오늘의 기록">
  <div class="sparkles" id="sp2"></div>
  <div class="valance"></div>
  <div class="hall-inner">
    <div class="topbar">
      <h2>♛ 오늘의 기록</h2>
      <div style="display:flex;gap:8px">
        <button class="btn" id="toGallery">기록표 보기</button>
        <button class="btn ghost" id="toDoor">문 밖으로</button>
      </div>
    </div>
    <form class="scroll-card" id="form" autocomplete="off">
      <div class="date-row">
        <label for="date">날짜</label>
        <input type="date" id="date" required>
        <span class="score" id="score"></span>
      </div>
      <div class="items" id="items"></div>
      <div class="actions">
        <span class="toast" id="toast" role="status"></span>
        <button type="submit" class="btn" id="save">저장하기</button>
      </div>
    </form>
    <p class="note">먹은 걸 적고, 참은 항목은 <b>안 먹음 X</b>를 눌러요. 먹은 양(200g, 1/3, 1캔)도 함께 적으면 좋아요.</p>
    <p class="note" id="storeNote"></p>
  </div>
</section>

<!-- ============ GALLERY (paper chart) ============ -->
<section id="gallery" class="screen palace off" aria-label="기록표">
  <div class="sparkles" id="sp3"></div>
  <div class="valance"></div>
  <div class="hall-inner" style="max-width:1100px">
    <div class="topbar">
      <h2>♛ 기록표</h2>
      <button class="btn" id="backHall">기록하러 가기</button>
    </div>
    <div class="paper">
      <div class="paper-head">
        <span class="month" id="monthLabel">10月</span>
        <h3>고칼로리 식품 줄이기</h3>
        <div class="pager">
          <button id="prev" aria-label="이전 기간">◀</button>
          <span id="rangeLabel"></span>
          <button id="next" aria-label="다음 기간">▶</button>
        </div>
      </div>
      <div class="table-wrap"><table id="chart"></table></div>
      <p class="legend">X = 안 먹음, 분홍 테두리 = 오늘, 칸을 누르면 그날 기록을 고칠 수 있어요</p>
    </div>
  </div>
</section>

<script>
const ITEMS = ["밥","빵","떡","과자","탄산","라떼","아이스크림","야식"];
const KEY = "debut-project-days";
const X = "X";
// Records from the paper chart (Oct 14–17). Used only when this page runs without the shared store.
const PAPER = {
  "2026-10-14":{"밥":"200g","빵":"햄·치즈·에그 토스트","떡":X,"과자":"과자 조금","탄산":"펩시 50","라떼":"피스타치오라떼","아이스크림":X,"야식":"홍시, 키위, 요거트"},
  "2026-10-15":{"밥":"100g","빵":"붕어빵 1.5","떡":X,"과자":X,"탄산":X,"라떼":"바닐라라떼","아이스크림":X,"야식":"홍시, 키위, 귤"},
  "2026-10-16":{"밥":"100g","빵":"붕어빵 1.5","떡":X,"과자":X,"탄산":"X → 50","라떼":"덜 달게 먹음","아이스크림":X,"야식":"홍시, 키위, 귤"},
  "2026-10-17":{"밥":"200g","빵":X,"떡":X,"과자":X,"탄산":"환타 180","라떼":X,"아이스크림":X,"야식":X}
};

const $ = id => document.getElementById(id);
let days = {};      // date -> {item: text}
let db = null;
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = iso(new Date());

/* ---------- storage: shared store when available, else this browser ---------- */
function loadLocal(){
  try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : {...PAPER}; }
  catch(e){ return {...PAPER}; }
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(days)); }catch(e){} }
days = loadLocal();

async function connectStore(){
  if(!window.claude || !window.claude.use) return;
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db) return;
  days = {};
  db.collection("days").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if(d.exists) next[d.id] = {...d.data()}; });
    days = next;
    if(!dirty) fillForm();
    renderChart();
  }, () => { $("storeNote").textContent = "기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요."; });
  $("storeNote").textContent = "";
}
async function persist(date, rec){
  days[date] = rec;
  if(db){
    await db.doc("days/" + date).set(rec);
  } else saveLocal();
}

/* ---------- form ---------- */
let dirty = false;
function buildForm(){
  $("items").innerHTML = ITEMS.map((it,i) => `
    <div class="item">
      <label class="name" for="in${i}">${it}</label>
      <input id="in${i}" data-item="${it}" placeholder="먹은 것 · 양">
      <button type="button" class="skip" data-skip="${i}" aria-pressed="false">안 먹음 X</button>
    </div>`).join("");
  $("items").addEventListener("click", e => {
    const b = e.target.closest("[data-skip]"); if(!b) return;
    const on = b.getAttribute("aria-pressed") !== "true";
    setSkip(+b.dataset.skip, on); dirty = true; updateScore();
  });
  $("items").addEventListener("input", () => { dirty = true; updateScore(); });
}
function setSkip(i, on){
  const b = document.querySelector(`[data-skip="${i}"]`), inp = $("in"+i);
  b.setAttribute("aria-pressed", on);
  inp.disabled = on;
  if(on) inp.value = "";
  inp.placeholder = on ? "참았어요 ♥" : "먹은 것 · 양";
}
function fillForm(){
  const rec = days[$("date").value] || {};
  ITEMS.forEach((it,i) => {
    const v = rec[it] || "";
    setSkip(i, v === X);
    $("in"+i).value = v === X ? "" : v;
  });
  dirty = false; updateScore();
}
function readForm(){
  const rec = {};
  ITEMS.forEach((it,i) => {
    if(document.querySelector(`[data-skip="${i}"]`).getAttribute("aria-pressed") === "true") rec[it] = X;
    else { const v = $("in"+i).value.trim(); if(v) rec[it] = v; }
  });
  return rec;
}
function updateScore(){
  const n = Object.values(readForm()).filter(v => v === X).length;
  $("score").textContent = `참은 항목 ${n} / ${ITEMS.length}`;
}
$("date").value = today;
buildForm(); fillForm();
$("date").addEventListener("change", fillForm);
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const date = $("date").value; if(!date) return;
  $("save").disabled = true;
  try{
    await persist(date, readForm());
    dirty = false;
    const [, m, d] = date.split("-");
    $("toast").textContent = `${+m}월 ${+d}일 기록을 저장했어요 ✨`;
    renderChart();
  }catch(err){
    $("toast").style.color = "var(--ruby)";
    $("toast").textContent = "저장하지 못했어요. 이 기록표를 고칠 권한이 있는지 확인해 주세요.";
  }finally{
    $("save").disabled = false;
    setTimeout(() => { $("toast").textContent = ""; $("toast").style.color = ""; }, 3500);
  }
});

/* ---------- chart (the paper table) ---------- */
let rangeStart = null; // Date
const SPAN = 16;
function defaultStart(){
  const keys = Object.keys(days).sort();
  const base = keys.length ? new Date(keys[0] + "T00:00") : new Date();
  const t = new Date();
  // keep today inside the window
  while((t - base) / 864e5 >= SPAN) base.setDate(base.getDate() + SPAN);
  return base;
}
function renderChart(){
  if(!rangeStart) rangeStart = defaultStart();
  const dates = [];
  for(let i=0;i<SPAN;i++){ const d = new Date(rangeStart); d.setDate(d.getDate()+i); dates.push(d); }
  $("monthLabel").textContent = `${rangeStart.getMonth()+1}月`;
  const last = dates[dates.length-1];
  $("rangeLabel").textContent = `${rangeStart.getMonth()+1}/${rangeStart.getDate()} – ${last.getMonth()+1}/${last.getDate()}`;
  const head = `<thead><tr><th>항목</th>${dates.map(d => `<th>${d.getDate()}</th>`).join("")}</tr></thead>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const body = ITEMS.map(it => `<tr><th>${it}</th>${dates.map(d => {
    const k = iso(d), v = (days[k]||{})[it] || "";
    const cls = [v===X?"x":"", k===today?"today":""].filter(Boolean).join(" ");
    return `<td class="${cls}" data-date="${k}" tabindex="0">${esc(v)}</td>`;
  }).join("")}</tr>`).join("");
  $("chart").innerHTML = head + `<tbody>${body}</tbody>`;
}
function shift(n){ rangeStart = new Date(rangeStart); rangeStart.setDate(rangeStart.getDate()+n*SPAN); renderChart(); }
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("chart").addEventListener("click", e => {
  const td = e.target.closest("td[data-date]"); if(!td) return;
  $("date").value = td.dataset.date; fillForm(); show("hall");
});
$("chart").addEventListener("keydown", e => { if(e.key === "Enter") e.target.click(); });

/* ---------- screens ---------- */
function show(id){
  ["entrance","hall","gallery"].forEach(s => $(s).classList.toggle("off", s !== id));
  if(id === "gallery") renderChart();
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
$("door").addEventListener("click", () => {
  document.body.classList.add("opening");
  setTimeout(() => show("hall"), reduce ? 0 : 1000);
});
$("toDoor").onclick = () => { document.body.classList.remove("opening"); show("entrance"); };
$("toGallery").onclick = () => show("gallery");
$("backHall").onclick = () => show("hall");

/* ---------- decoration ---------- */
["sp1","sp2","sp3"].forEach(id => {
  const el = $(id);
  for(let i=0;i<26;i++){
    const s = document.createElement("i");
    s.style.left = Math.random()*100 + "%"; s.style.top = Math.random()*80 + "%";
    s.style.animationDelay = (Math.random()*2.4).toFixed(2) + "s";
    const k = 6 + Math.random()*10; s.style.width = s.style.height = k + "px";
    if(reduce) s.style.animation = "none";
    el.appendChild(s);
  }
});
function drawGarden(){
  const c = $("garden"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight; if(!w) return;
  c.width = w*dpr; c.height = h*dpr;
  const g = c.getContext("2d"); g.scale(dpr,dpr);
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  g.fillStyle = "#2f8a3e"; g.fillRect(0,h-26,w,26);
  for(let x=0;x<w;x+=4){ // grass blades
    const bh = 18 + rnd()*26;
    g.strokeStyle = rnd() > .5 ? "#57b65a" : "#3fa04b"; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(x,h); g.quadraticCurveTo(x+rnd()*8-4,h-bh/2,x+rnd()*10-5,h-bh); g.stroke();
  }
  const petals = ["#ff7fb0","#ffffff","#ff4d7d","#ffd1e2","#ffe39a"];
  for(let x=10;x<w;x+=26+rnd()*22){ // flowers
    const y = h - 28 - rnd()*34, r = 5 + rnd()*4, col = petals[Math.floor(rnd()*petals.length)];
    g.strokeStyle = "#2f8a3e"; g.lineWidth = 2; g.beginPath(); g.moveTo(x,h); g.lineTo(x,y); g.stroke();
    g.fillStyle = col;
    for(let k=0;k<5;k++){ const a = k*Math.PI*2/5; g.beginPath(); g.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.8,0,7); g.fill(); }
    g.fillStyle = "#e8b53a"; g.beginPath(); g.arc(x,y,r*.6,0,7); g.fill();
  }
}
drawGarden(); addEventListener("resize", drawGarden);

connectStore();
</script>
